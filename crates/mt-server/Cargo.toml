[package]
name = "mt-server"
description = "The agenttable server: one binary serving the API and the embedded web app. End-to-end build of the finished components, with placeholders for the parts still to come."
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "agenttable"
path = "src/main.rs"

[dependencies]
mt-audit = { path = "../mt-audit" }
mt-core = { path = "../mt-core" }
mt-formula = { path = "../mt-formula" }
mt-lifecycle = { path = "../mt-lifecycle" }
mt-perm = { path = "../mt-perm" }
mt-query = { path = "../mt-query" }
mt-refdata = { path = "../mt-refdata" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rust-embed = { version = "8", features = ["mime-guess"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
